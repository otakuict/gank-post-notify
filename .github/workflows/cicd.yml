name: CI and deploy to Ubuntu server

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOCKERHUB_IMAGE: otakuict/gank-post-notify

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate deployment script
        run: bash -n scripts/deploy-server.sh

      # The Dockerfile runs Node.js tests before creating the runtime image.
      - name: Build production image
        env:
          IMAGE: gank-post-notify:${{ github.sha }}
        run: docker build --pull --tag "$IMAGE" .

      - name: Check Docker Hub username
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: test -n "$DOCKERHUB_USERNAME"

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image to Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          LOCAL_IMAGE: gank-post-notify:${{ github.sha }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker tag "$LOCAL_IMAGE" "$DOCKERHUB_IMAGE:$SHA"
          docker push "$DOCKERHUB_IMAGE:$SHA"

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 15
    steps:
      - name: Check out deployment script
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull and deploy image
        env:
          SHA: ${{ github.sha }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          image="$DOCKERHUB_IMAGE:$SHA"
          docker pull "$image"
          bash scripts/deploy-server.sh "$image"
